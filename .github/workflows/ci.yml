name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run backend TypeScript check
        run: npm run typecheck
        working-directory: backend
      - name: Run backend ESLint (report-only, non-blocking)
        run: npm run lint
        working-directory: backend
        continue-on-error: true

  frontend:
    name: Frontend typecheck & build (含 SSR)
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript check (client + server entries)
        run: npx tsc -b
        working-directory: frontend
      - name: Build site (client + SSR bundle + 后处理复制到 backend)
        run: npm run build:site
        working-directory: frontend
