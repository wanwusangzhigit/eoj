name: Judge Submission

on:
  push:
    paths:
      - 'submissions/*'

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Extract submission info
        id: info
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep 'submissions/' | head -1)
          if [ -z "$FILES" ]; then
            FILES=$(find submissions/ -maxdepth 1 -type f ! -name '.gitkeep' | head -1)
          fi
          echo "file=$FILES" >> $GITHUB_OUTPUT
          FILENAME=$(basename "$FILES")
          SUBMISSION_ID=$(echo "$FILENAME" | sed 's/\.[^.]*$//')
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT
          EXT="${FILENAME##*.}"
          case "$EXT" in
            py) LANGUAGE="python" ;;
            cpp) LANGUAGE="cpp" ;;
            java) LANGUAGE="java" ;;
            js) LANGUAGE="javascript" ;;
            c) LANGUAGE="c" ;;
            go) LANGUAGE="go" ;;
            rs) LANGUAGE="rust" ;;
            *) LANGUAGE="unknown" ;;
          esac
          echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "Detected: id=$SUBMISSION_ID, lang=$LANGUAGE, file=$FILES"

      - name: Fetch judge data
        id: judge_data
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          WORKER_API: ${{ secrets.WORKER_API }}
        run: |
          SUBMISSION_ID="${{ steps.info.outputs.submission_id }}"
          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR: No submission ID found"
            exit 1
          fi
          mkdir -p "$HOME/judge_meta"
          RESPONSE=$(curl -s --max-time 10 --retry 3 \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            "${WORKER_API}/api/v1/internal/judge-data?submission_id=${SUBMISSION_ID}")
          echo "$RESPONSE" > "$HOME/judge_meta/judge_data.json"
          echo "JUDGE_DATA_PATH=$HOME/judge_meta/judge_data.json" >> "$GITHUB_ENV"

      # nsjail is not packaged in Ubuntu 24.04 (noble), so we build it from
      # source once and cache the binary at repo level (Actions cache). On a
      # cache hit the install step just copies the binary and installs its
      # runtime libs — no rebuild, no git clone.
      - name: Restore nsjail binary cache
        id: nsjail-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nsjail-bin
          key: nsjail-3.4-${{ runner.arch }}

      # apt .deb packages (openjdk/golang/rustc/...) are re-downloaded on every
      # run. Cache the .deb files so `apt-get install` installs from local
      # files (no network download of the big toolchains).
      - name: Restore apt package cache
        id: apt-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/apt-cache
          key: apt-archives-${{ runner.arch }}

      - name: Install nsjail and language runtimes
        run: |
          set -euo pipefail
          echo "Installing compilers and runtimes..."
          # Restore cached .deb packages (if any) so apt installs offline.
          if [ -d /tmp/apt-cache ] && [ -n "$(ls /tmp/apt-cache/*.deb 2>/dev/null)" ]; then
            echo "Using cached .deb packages ($(ls /tmp/apt-cache/*.deb | wc -l) files)"
            sudo mkdir -p /var/cache/apt/archives
            sudo cp -a /tmp/apt-cache/. /var/cache/apt/archives/ || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -qq \
            time golang-go rustc cargo default-jdk

          # Node.js 22 LTS
          if ! command -v node >/dev/null 2>&1 || [ "$(node -v | cut -d'v' -f2 | cut -d'.' -f1)" -lt 22 ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
            sudo apt-get install -y --no-install-recommends -qq nodejs
          fi

          # nsjail is NOT packaged in Ubuntu 24.04 (noble) universe. Priority:
          # 1) prebuilt binary committed to the repo (binaries/nsjail) — zero
          #    build, zero cache dependency
          # 2) binary from the Actions cache
          # 3) build from source, save to cache AND push back to the repo so
          #    future runs never rebuild
          # The binary is dynamically linked, so the libs below are needed in
          # every path.
          sudo apt-get install -y --no-install-recommends -qq \
            libprotobuf-dev libnl-3-dev libnl-route-3-dev libcap-dev pkg-config

          if [ -x binaries/nsjail ]; then
            echo "nsjail from repo (prebuilt binary)"
            sudo cp binaries/nsjail /usr/local/bin/
          elif [ -x /tmp/nsjail-bin/nsjail ]; then
            echo "nsjail restored from Actions cache"
            sudo cp /tmp/nsjail-bin/nsjail /usr/local/bin/
          else
            echo "Building nsjail from source (cache miss)..."
            sudo apt-get install -y --no-install-recommends -qq \
              build-essential git protobuf-compiler
            git clone --depth 1 --branch 3.4 https://github.com/google/nsjail.git /tmp/nsjail-src
            make -C /tmp/nsjail-src -j2
            sudo cp /tmp/nsjail-src/nsjail /usr/local/bin/
            rm -rf /tmp/nsjail-src
            mkdir -p /tmp/nsjail-bin
            cp /usr/local/bin/nsjail /tmp/nsjail-bin/
          fi

          # Stage downloaded .deb files for the cache save step.
          sudo mkdir -p /tmp/apt-cache
          sudo cp -a /var/cache/apt/archives/*.deb /tmp/apt-cache/ 2>/dev/null || true

          echo "Versions:"
          # nsjail has no --version flag (it errors with exit 255); just
          # verify the binary is present on PATH.
          command -v nsjail && echo "nsjail OK"
          gcc --version | head -1
          python3 --version
          java -version 2>&1 | head -1
          node --version
          go version
          rustc --version
          /usr/bin/time --version | head -1

      - name: Save nsjail binary cache
        if: steps.nsjail-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/nsjail-bin
          key: nsjail-3.4-${{ runner.arch }}

      - name: Save apt package cache
        if: steps.apt-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/apt-cache
          key: apt-archives-${{ runner.arch }}

      - name: Compile and Judge (nsjail sandbox)
        id: judge
        run: |
          chmod +x scripts/judge.sh
          bash scripts/judge.sh
        env:
          SUBMISSION_ID: ${{ steps.info.outputs.submission_id }}
          LANGUAGE: ${{ steps.info.outputs.language }}
          SOURCE_FILE: ${{ steps.info.outputs.file }}
          JUDGE_DATA: ${{ env.JUDGE_DATA_PATH }}

      - name: Callback result
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          WORKER_API: ${{ secrets.WORKER_API }}
          SUBMISSION_ID: ${{ steps.info.outputs.submission_id }}
        run: |
          set -o errexit
          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR submission_id empty, skip callback"
            exit 0
          fi
          CALL_URL="${WORKER_API}/api/v1/internal/callback"
          if [ -f result.json ]; then
            echo "Send normal callback, file content:"
            cat result.json
            RESP=$(curl -X POST "$CALL_URL" \
              --max-time 10 --retry 2 \
              -H "Authorization: Bearer $CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d @result.json -w $'\nHTTP_CODE=%{http_code}' 2>&1)
            echo "$RESP"
            if echo "$RESP" | grep -q "HTTP_CODE=200"; then
              echo "Callback success"
            else
              echo "Callback request failed, trigger fallback"
              echo "{\"submission_id\":\"$SUBMISSION_ID\",\"status\":\"system_error\",\"details\":[{\"message\":\"Judge callback request failed\"}]}" > fallback_result.json
              curl -X POST "$CALL_URL" \
                --max-time 10 --retry 2 \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -H "Content-Type: application/json" \
                -d @fallback_result.json
            fi
          else
            echo "No result.json, send system error fallback"
            echo "{\"submission_id\": \"$SUBMISSION_ID\", \"status\": \"system_error\", \"details\": [{\"status\": \"system_error\", \"message\": \"Judge failed to produce result\"}]}" > fallback_result.json
            curl -X POST "$CALL_URL" \
              --max-time 10 --retry 2 \
              -H "Authorization: Bearer $CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d @fallback_result.json
          fi
