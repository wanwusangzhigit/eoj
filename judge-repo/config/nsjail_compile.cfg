description: "EOJ Compile Sandbox"
mode: ONCE
uidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
rlimit_as: 2048
rlimit_cpu: 60
rlimit_nofile: 128
rlimit_nproc: 128
rlimit_fsize: 1048576
mount_proc: false
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/full"
  dst: "/dev/full"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self"
  dst: "/proc"
  is_bind: true
  rw: false
}
seccomp_log: false
time_limit: 60
max_cpus: 2
hostname: "compile-sandbox"
cwd: "/box"
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
